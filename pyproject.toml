[project]
name = "modelmora"
version = "0.1.0"
description = "The Studio's one place for open-weight model inference: text and image generation on one GPU, served to Studio callers over a loopback API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Only needed on the Studio machine itself, to run real models on the GPU. The base
# install (and CI) never needs these: FR-033 and FR-034 require the queue, registry
# and API to be testable with no GPU, via the stand-in runners.
gpu = [
  "torch>=2.3",
  "transformers>=4.42",
  "diffusers>=0.29",
  "accelerate>=0.31",
]

[project.scripts]
modelmora = "modelmora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmora"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "jsonschema>=4.18",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
ignore_missing_imports = true
